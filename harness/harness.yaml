project_name: "enterprise-file-platform"
mission: "Build and operate a robust file ingestion platform with secure archive handling, scalable parsing, indexed search, and practical dashboards for operators."
operating_mode: "local-first with reproducible bootstrap and explicit quality gates"
tech_stack:
  - "Go (HTTP API, orchestration, typed data contracts)"
  - "Python (worker, extractors/parsers, loaders, batch processing)"
  - "React + TypeScript + Vite (web UI)"
  - "PostgreSQL (metadata, jobs, parsed records, settings)"
  - "Redis (queue + orchestration signaling)"
  - "MinIO (object storage)"
  - "OpenSearch (search and indexing)"
  - "Docker Compose (local runtime)"
design_principles:
  - "Use explicit ownership boundaries and contracts"
  - "Prefer idempotent operations and restart-safe processing"
  - "Keep security and tenant safety visible in every workflow"
  - "Prefer testable local artifacts over abstract placeholders"
agents:
  - "architect"
  - "backend-go"
  - "worker-python"
  - "frontend-react"
  - "database"
  - "search"
  - "devops"
  - "security"
  - "qa"
  - "docs"
subagents:
  - "archive-extraction"
  - "txt-parser"
  - "csv-parser"
  - "json-parser"
  - "upload-flow"
  - "search-indexing"
  - "dashboard"
  - "observability"
skills:
  - "api-design"
  - "parser-design"
  - "database-migration"
  - "frontend-component"
  - "docker-compose"
  - "testing"
  - "threat-modeling"
  - "code-review"
hooks:
  - "pre-implementation-checklist"
  - "pre-commit-checklist"
  - "pre-merge-review"
  - "security-review"
  - "parser-safety-review"
  - "release-readiness"
command_catalog:
  review:
    command: "bash harness/scripts/review.sh <scope>"
    purpose: "Run requirement/impact review, collect affected artifacts, and produce evidence."
    expected_output: "harness/artifacts/review-*.md"
  design:
    command: "bash harness/scripts/design.sh <agent>"
    purpose: "Create cross-service HLD/LLD update proposal and validation contracts."
    expected_output: "harness/artifacts/design-*.md"
  plan:
    command: "bash harness/scripts/plan.sh <scope>"
    purpose: "Decompose work by owner and produce acceptance criteria per unit."
    expected_output: "harness/artifacts/plan-*.md"
  agree:
    command: "bash harness/scripts/agree.sh"
    purpose: "Record owner sign-off and explicit tradeoffs before implementation."
    expected_output: "harness/artifacts/agree-*.md"
  test:
    command: "bash harness/scripts/test-run.sh"
    purpose: "Run all repo test/build gates and capture evidence."
    expected_output: "harness/artifacts/test-*.md and /tmp logs"
  validation:
    command: "bash harness/scripts/validate.sh"
    purpose: "Run end-to-end validation with known sample files."
    expected_output: "harness/artifacts/validate-*.md"
  self_improve:
    command: "bash harness/scripts/self-improve.sh \"<note>\""
    purpose: "Update known risks/backlog/ADR and reflect process improvements."
    expected_output: "memory files updated in harness/memory"
  release:
    command: "bash harness/scripts/release.sh"
    purpose: "Assemble release artifact with risk notes and rollback plan."
    expected_output: "harness/artifacts/release-*.md"
  pipeline:
    command: "bash harness/scripts/pipeline.sh --scope \"<scope>\" --agent \"<agent>\" --mode <light|full>"
    purpose: "Execute full workflow stages from review to agree with optional full test/validation mode."
    expected_output: "harness/artifacts/pipeline-*.md"
  note: "These commands are executable harness workflow helpers in this directory."
workflows:
  - "feature-development"
  - "parser-addition"
  - "api-change"
  - "incident-debugging"
  - "release"
governance:
  owner_signoff_required:
    - "architect"
    - "backend-go"
    - "worker-python"
    - "frontend-react"
    - "database"
    - "security"
    - "qa"
  escalation_path:
    - "qa raises quality risk"
    - "security raises risk"
    - "architect resolves contract conflict"
    - "docs updates user-visible behavior"
quality_gates:
  - name: "No unhandled parse failures"
    criteria: "New code paths include explicit error categories and structured job events."
  - name: "Searchability preserved"
    criteria: "Any new parser emits query-friendly records and indexed entities."
  - name: "Security first"
    criteria: "Threat model/secret handling and input validation are reviewed before merge."
  - name: "Data integrity"
    criteria: "Record counts and status transitions are measurable and logged."
  - name: "Operator visibility"
    criteria: "Events, logs, and metrics reflect each major state transition."
  - name: "Process quality"
    criteria: "Review->Design->Plan->Agree->Test->Validation hooks completed and documented."
local_commands:
  - "bash harness/scripts/review.sh"
  - "bash harness/scripts/design.sh"
  - "bash harness/scripts/plan.sh"
  - "bash harness/scripts/agree.sh"
  - "make up"
  - "make down"
  - "make migrate"
  - "make seed"
  - "make search-init"
  - "make harness"
  - "make harness-full"
  - "make logs"
  - "make ps"
  - "bash harness/scripts/validate.sh"
  - "bash harness/scripts/test-run.sh"
  - "bash harness/scripts/pipeline.sh --scope \"...\" --agent \"...\" --mode full"
  - "rg -n \"TODO\" apps api worker"
  - "go test ./..."
  - "python -m pytest"
  - "npm --prefix apps/web run build"
continuous_improvement:
  evidence_cycle:
    - "After every feature or release, update:"
    - "  - docs/harness/how-to-use-harness.md (if workflow changes)"
    - "  - harness/memory/architecture-decisions.md (if architecture touched)"
    - "  - harness/memory/known-risks.md (if new risks found)"
    - "  - harness/memory/backlog.md (if follow-up work identified)"
    - "  - harness/commands.md (if command/process expectations changed)"
  cadence: "At least once per release and for major incident postmortems."
definition_of_done:
  - "Functionality implemented and mapped to a workflow and at least one owner agent"
  - "Feature behavior validated with expected artifacts or logs"
  - "Relevant hook checklists executed and blockers resolved"
  - "Harness files updated if process changed"
  - "README/docs updated for user- or operator-visible behavior"
  - "Security/quality gates satisfied"
  - "Ownership decisions and known risks updated in harness/memory"
