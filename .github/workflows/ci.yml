name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Run Go tests
        run: go test ./...

  test-worker:
    name: Worker Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install worker dependencies
        run: python -m pip install -r requirements.txt
      - name: Run worker tests
        run: python -m pytest -q tests

  test-web:
    name: Web Tests and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Run frontend tests
        run: npm run test
      - name: Build frontend
        run: npm run build

  lint-placeholders:
    name: Lint Placeholders
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: API lint placeholder
        run: |
          echo "API lint placeholder: add static checks in future"
      - name: Worker lint placeholder
        run: |
          echo "Worker lint placeholder: add ruff/flake8 checks in future"
      - name: Frontend lint placeholder
        run: |
          echo "Frontend lint placeholder: add eslint checks in future"
