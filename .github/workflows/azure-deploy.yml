name: Deploy to Azure

# Manual only. Do the first deployment by hand (docs/deploy/azure-manual-deployment.md);
# this workflow then automates the repeatable part: build images, roll the Container Apps,
# rebuild and upload the static UI.
#
# Setup (guide, section 14):
#   Secrets:   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID  (OIDC; no password stored)
#              AZURE_STATIC_WEB_APPS_API_TOKEN, VITE_API_KEY
#   Variables: AZURE_RG, AZURE_ACR, AZURE_API_APP, AZURE_WORKER_APP, VITE_API_BASE_URL
on:
  workflow_dispatch:

permissions:
  id-token: write   # lets GitHub mint the OIDC token Azure trusts
  contents: read

concurrency:
  group: azure-deploy
  cancel-in-progress: false

jobs:
  backend:
    name: Build images and roll Container Apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # docker build + push rather than `az acr build`: ACR Tasks are disabled on many
      # free-trial subscriptions, and GitHub's runners are already linux/amd64.
      - name: Build and push images
        run: |
          registry="${{ vars.AZURE_ACR }}.azurecr.io"
          tag="${GITHUB_SHA::12}"
          az acr login --name "${{ vars.AZURE_ACR }}"
          docker build -t "$registry/parser-api:$tag"    apps/api
          docker build -t "$registry/parser-worker:$tag" apps/worker
          docker push "$registry/parser-api:$tag"
          docker push "$registry/parser-worker:$tag"

      - name: Roll out new revisions
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update -g "${{ vars.AZURE_RG }}" -n "${{ vars.AZURE_API_APP }}" \
            --image "${{ vars.AZURE_ACR }}.azurecr.io/parser-api:${GITHUB_SHA::12}"
          az containerapp update -g "${{ vars.AZURE_RG }}" -n "${{ vars.AZURE_WORKER_APP }}" \
            --image "${{ vars.AZURE_ACR }}.azurecr.io/parser-worker:${GITHUB_SHA::12}"

      # The API ingress is IP-restricted (guide section 10), so a GitHub runner cannot reach
      # /health. Ask Azure instead whether the new revision became ready.
      - name: Wait for healthy revisions
        run: |
          for app in "${{ vars.AZURE_API_APP }}" "${{ vars.AZURE_WORKER_APP }}"; do
            for i in $(seq 1 30); do
              read -r latest ready < <(az containerapp show -g "${{ vars.AZURE_RG }}" -n "$app" \
                --query "[properties.latestRevisionName, properties.latestReadyRevisionName]" -o tsv | tr '\n' ' ')
              [ -n "$latest" ] && [ "$latest" = "$ready" ] && echo "$app ready: $latest" && break
              [ "$i" = 30 ] && echo "$app revision $latest never became ready" && exit 1
              sleep 10
            done
          done

  web:
    name: Build and deploy UI
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build
        working-directory: apps/web
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
          VITE_MAX_UPLOAD_MB: '10'
        run: npm ci && npm run build
      - name: Upload to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: apps/web/dist
          skip_app_build: true
          skip_api_build: true
