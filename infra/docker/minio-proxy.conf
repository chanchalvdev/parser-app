server {
    listen 9000;

    # Allow large uploads — must be >= the API's MAX_UPLOAD_SIZE_MB in parser/.env.
    # Nginx default is 1m which silently produces 413 on any upload > 1 MB.
    # 12 GB body cap gives 2 GB of headroom over the 10 GB upload target.
    client_max_body_size 12288m;
    client_body_buffer_size 128k;

    # Streaming + long timeouts so multi-GB PUTs do not get truncated mid-body.
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 60s;
    client_body_timeout 3600s;

    location / {
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host minio:9000;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
