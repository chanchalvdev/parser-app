# Hosted (free-tier) overrides. Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Files > 10 MB are rejected here (API setting + proxy cap) and handled on a local stack instead.
services:
  postgres:
    ports: !reset []
    restart: unless-stopped
  redis:
    ports: !reset []
    restart: unless-stopped
  minio:
    ports: !reset []
    restart: unless-stopped
  minio-proxy:
    ports: !reset []
    volumes: !override
      - ./infra/docker/minio-proxy.prod.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
  opensearch:
    ports: !reset []
    restart: unless-stopped
    mem_limit: 3g
    environment:
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
  opensearch-dashboards:
    profiles: ["debug"]
  api:
    ports: !reset []
    restart: unless-stopped
  worker:
    restart: unless-stopped
    mem_limit: 3g
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.prod
    image: file-platform-web-prod
    command: !reset null
    ports: !reset []
    healthcheck:
      disable: true
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    container_name: file-platform-caddy
    environment:
      APP_HOST: ${APP_HOST}
      S3_HOST: ${S3_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api
      - web
      - minio-proxy
    restart: unless-stopped

volumes:
  caddy_data:
