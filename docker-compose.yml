services:
  postgres:
    image: postgres:16-alpine
    container_name: file-platform-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: file-platform-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: file-platform-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    expose:
      - "9000"

  minio-proxy:
    image: nginx:1.27-alpine
    container_name: file-platform-minio-proxy
    depends_on:
      minio:
        condition: service_started
    ports:
      - "9000:9000"
    volumes:
      - ./infra/docker/minio-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: file-platform-opensearch
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    ports:
      - "9200:9200"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=1s || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 10s

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    container_name: file-platform-opensearch-dashboards
    depends_on:
      opensearch:
        condition: service_healthy
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
      SERVER_HOST: 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:5601/api/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 15s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: file-platform-api
    container_name: file-platform-api
    environment:
      APP_ENV: ${APP_ENV}
      API_PORT: ${API_PORT}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_ADDR: ${REDIS_ADDR}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB}
      QUEUE_NAME: ${QUEUE_NAME}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PRESIGN_ENDPOINT: ${MINIO_PRESIGN_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      OPENSEARCH_URL: ${OPENSEARCH_SERVICE_URL:-http://opensearch:9200}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    ports:
      - "8088:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - "API_PORT=${API_PORT:-8080}; curl -f http://127.0.0.1:${API_PORT}/health"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    image: file-platform-worker
    container_name: file-platform-worker
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_ADDR: ${REDIS_ADDR}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB}
      WORKER_QUEUE_NAME: ${WORKER_QUEUE_NAME}
      WORKER_REDIS_BLOCK_TIMEOUT: ${WORKER_REDIS_BLOCK_TIMEOUT}
      WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_USE_SSL: ${MINIO_USE_SSL}
      OPENSEARCH_URL: ${OPENSEARCH_SERVICE_URL:-http://opensearch:9200}
      WORKER_TEMP_DIR: ${WORKER_TEMP_DIR}
      WORKER_LOG_LEVEL: ${WORKER_LOG_LEVEL}
    command: >
      python -m app.main
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "[ -r /proc/1/cmdline ]"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 5s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    image: file-platform-web
    container_name: file-platform-web
    env_file:
      - .env
    depends_on:
      api:
        condition: service_started
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    ports:
      - "5188:5173"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    healthcheck:
      test:
        - CMD-SHELL
        - "node -e \"const http = require('http'); const req = http.get('http://127.0.0.1:5173', (res) => { process.exit(res.statusCode && res.statusCode < 400 ? 0 : 1) }); req.on('error', () => process.exit(1));\""
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

volumes:
  postgres_data:
  minio_data:
  opensearch_data:
